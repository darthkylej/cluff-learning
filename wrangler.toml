name = "cluff-learning-api"
main = "worker.js"
compatibility_date = "2026-08-01"
keep_vars = true
workers_dev = true

[secrets]
required = [
  "DATABASE_URL",      # Neon pooled connection string
  "JWT_SECRET",        # long random string
  "RESEND_API_KEY",    # Resend API key
  "RESEND_FROM",       # e.g. "Cluff Learning <no-reply@yourdomain.com>"
  "BOOTSTRAP_EMAILS",  # comma-separated admin emails allowed to self-register
  "ANTHROPIC_API_KEY", # Claude — essay grading, and the Spanish conversation brain
  "OPENAI_API_KEY",    # speech synthesis for Spanish Coach
]

[vars]
# ── Spanish Coach ──
# Voice must be chosen by the Gate 0 audition first — see docs/VOICE_AUDITION.md.
SPANISH_TTS_MODEL = "gpt-4o-mini-tts"
SPANISH_TTS_VOICE = "coral"
SPANISH_TTS_SPEED = "1.0"
# Speech recognition for browsers without the Web Speech API (Firefox, Brave).
# whisper-1 returns per-segment logprobs, which is how the coach still knows
# when a transcript is unreliable and must not be treated as a learner error.
SPANISH_STT_MODEL = "whisper-1"
# Hard ceiling on paid audio across the whole family, per calendar month.
# Baseline usage (4 kids x 15 min x 30 days) is ~1800; 2400 leaves headroom.
SPANISH_MONTHLY_AUDIO_MINUTES = "2400"
