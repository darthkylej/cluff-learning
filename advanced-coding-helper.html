<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Coding Helper · Cluff Learning Systems</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#070c18;color:#e6eefb}*{box-sizing:border-box}body{margin:0}header{padding:14px 20px;border-bottom:1px solid #293c55;display:flex;align-items:center;gap:12px;background:#0a1323}a{color:#4fd1e0;text-decoration:none}button{cursor:pointer;background:#182b43;color:#e6eefb;border:1px solid #39536c;border-radius:8px;padding:9px 13px}button:hover{background:#244361}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);height:calc(100dvh - 59px)}aside{border-right:1px solid #293c55;padding:14px;overflow:auto}#threads button{display:block;width:100%;text-align:left;margin:7px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.active{border-color:#4fd1e0}main{display:flex;flex-direction:column;min-width:0}#messages{flex:1;overflow:auto;padding:24px max(18px,calc((100% - 900px)/2));display:flex;flex-direction:column;gap:18px}.message{line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#16263c;padding:14px;border-radius:12px;align-self:flex-end;max-width:90%}.assistant{width:100%}.role{font-size:12px;color:#4fd1e0;font-weight:700;margin-bottom:6px}pre{background:#030811;border:1px solid #34435a;border-radius:9px;padding:15px;overflow:auto;white-space:pre}code{font-family:ui-monospace,monospace;font-size:13px}pre button{float:right;margin:-6px -6px 8px 10px;font-size:12px}.composer{border-top:1px solid #293c55;padding:14px max(18px,calc((100% - 900px)/2));display:flex;gap:10px}textarea{flex:1;resize:vertical;min-height:65px;max-height:200px;background:#0b1728;border:1px solid #39536c;border-radius:9px;padding:12px;color:inherit;font:inherit}#notice{font-size:12px;color:#a9b9ce;padding:0 18px 8px}.attachment{display:flex;align-items:center;gap:10px;padding:8px 14px}.attachment img{max-height:95px;max-width:150px;border-radius:7px}.attachment button{padding:5px 9px}.message img.screenshot{display:block;max-width:min(100%,700px);max-height:500px;object-fit:contain;margin-top:8px;border-radius:8px}#attach{flex:none} 
/* Sidebar: one consistent layout at each breakpoint. */
.shell{height:calc(100dvh - 59px);min-height:0;overflow:hidden}
aside{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:12px;border-right:1px solid #293c55}
#new{width:100%;flex:none;text-align:center}
#threads{display:flex;flex-direction:column;gap:4px;min-height:0;flex:1;overflow-y:auto;overflow-x:hidden}
.threadrow{display:flex;align-items:center;gap:5px;min-width:0;width:100%}
.threadrow>button:first-child{display:block;min-width:0;flex:1;width:auto;margin:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.threadrow .delete{display:grid;place-items:center;flex:0 0 24px!important;width:24px!important;min-width:24px;max-width:24px;height:24px;padding:0!important;margin:0!important;border:0;background:transparent;color:#a9b9ce;font-size:17px;line-height:1;border-radius:5px}.threadrow .delete:hover{color:#ffb5b5;background:#442638}.threadrow>button:first-child{font-size:14px;line-height:1.3;padding:10px 9px}
main{min-height:0;overflow:hidden}
header{position:relative;z-index:2}
.composer{flex-shrink:0;background:#0a1323}
#notice{flex-shrink:0}
#messages{min-height:0;overscroll-behavior:contain}
@media(max-width:650px){
 .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 aside{border-right:0;border-bottom:1px solid #293c55;padding:8px;gap:8px;flex-direction:row;align-items:center;min-height:0}
 #new{width:auto;white-space:nowrap}
 #threads{flex:1;min-width:0;flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:center;gap:7px}
 .threadrow{width:230px;flex:0 0 230px;max-width:none}
 .threadrow>button:first-child{width:auto;flex:1;min-width:0}
 #messages{padding:15px}
 .composer{padding:10px;align-items:flex-end}
 .composer textarea{min-height:55px}
}
</style></head><body>
<header><a href="index.html">← Bridge</a><strong>⌘ Advanced Coding Helper</strong></header>
<div class="shell"><aside><button id="new">+ New chat</button><div id="threads"></div></aside><main><div id="messages"></div><div class="attachment" id="attachment" hidden></div><form class="composer" id="form"><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><button id="attach" type="button" title="Attach screenshot">📎 Screenshot</button><textarea id="prompt" placeholder="Ask about coding, databases, APIs, debugging, or deploying an application…" required></textarea><button id="send">Send</button></form><div id="notice">Conversations sync to your account in Neon. Do not paste secrets.</div></main></div>
<script>
const API='https://cluff-learning-api.kylecluff.workers.dev',KEY='cls_advanced_coding_chats_v1',TOKEN='cls_jwt';
let chats=[],selected=null,busy=false,pendingImage=null,loading=true;
const el=id=>document.getElementById(id),current=()=>chats.find(c=>c.id===selected);
const token=()=>localStorage.getItem(TOKEN);
async function api(path,method='GET',body){
 const response=await fetch(API+path,{method,headers:{Authorization:'Bearer '+token(),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||'Request failed ('+response.status+')');
 return data;
}
async function saveChat(c){await api('/coding/chats','PUT',{id:c.id,title:c.title,messages:c.messages});}
function showAttachment(){const box=el('attachment');box.replaceChildren();box.hidden=!pendingImage;if(!pendingImage)return;const img=document.createElement('img');img.src=pendingImage.data;img.alt='Screenshot preview';const label=document.createElement('span');label.textContent=pendingImage.name;const remove=document.createElement('button');remove.textContent='Remove';remove.onclick=()=>{pendingImage=null;el('file').value='';showAttachment()};box.append(img,label,remove)}
async function attachFile(file){if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)){el('notice').textContent='Choose a PNG, JPEG, WebP, or GIF screenshot.';return}if(file.size>4*1024*1024){el('notice').textContent='Screenshot exceeds 4 MB.';return}const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});pendingImage={name:file.name,data};showAttachment()}
el('attach').onclick=()=>el('file').click();
el('file').onchange=async e=>{try{await attachFile(e.target.files[0])}catch{el('notice').textContent='Could not read screenshot.'}};
el('prompt').addEventListener('paste',async e=>{const item=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(item){e.preventDefault();try{await attachFile(item.getAsFile())}catch{el('notice').textContent='Could not paste screenshot.'}}});
async function create(){if(busy||loading)return;const c={id:crypto.randomUUID(),title:'New conversation',messages:[]};chats.unshift(c);selected=c.id;render();try{await saveChat(c)}catch(e){el('notice').textContent='Could not create chat: '+e.message}}
async function removeChat(id){if(busy||loading||!confirm('Delete this conversation permanently?'))return;try{await api('/coding/chats/'+id,'DELETE');chats=chats.filter(c=>c.id!==id);if(selected===id)selected=chats[0]?.id||null;render();el('notice').textContent='Conversation deleted.'}catch(e){el('notice').textContent='Delete failed: '+e.message}}
function render(){const threads=el('threads');threads.replaceChildren();for(const c of chats){const row=document.createElement('div');row.className='threadrow';const b=document.createElement('button');b.textContent=c.title;b.title=c.title;b.className=c.id===selected?'active':'';b.onclick=()=>{selected=c.id;render()};const del=document.createElement('button');del.className='delete';del.textContent='×';del.title='Delete chat';del.setAttribute('aria-label','Delete '+c.title);del.onclick=()=>removeChat(c.id);row.append(b,del);threads.append(row)}
 const box=el('messages');box.replaceChildren();const c=current();if(!c||!c.messages.length){const intro=document.createElement('div');intro.className='message assistant';intro.textContent=loading?'Loading conversations…':'What would you like to build or debug?';box.append(intro);return}
 for(const m of c.messages){const wrap=document.createElement('div');wrap.className='message '+m.role;const label=document.createElement('div');label.className='role';label.textContent=m.role==='user'?'You':'Coding Helper';wrap.append(label);if(m.role==='user'){wrap.append(document.createTextNode(m.content));if(m.image?.data){const img=document.createElement('img');img.className='screenshot';img.src=m.image.data;img.alt='Attached screenshot';wrap.append(img)}}else formatAnswer(wrap,m.content);box.append(wrap)}box.scrollTop=box.scrollHeight}
function formatAnswer(parent,s){const re=/```([^\n`]*)\n([\s\S]*?)```/g;let last=0,m;while((m=re.exec(s))){if(m.index>last)parent.append(document.createTextNode(s.slice(last,m.index)));const pre=document.createElement('pre'),btn=document.createElement('button'),code=document.createElement('code');btn.textContent='Copy';const snippet=m[2];btn.onclick=()=>navigator.clipboard.writeText(snippet).then(()=>btn.textContent='Copied');code.textContent=(m[1]?m[1]+'\n':'')+snippet;pre.append(btn,code);parent.append(pre);last=re.lastIndex}if(last<s.length)parent.append(document.createTextNode(s.slice(last)))}
el('new').onclick=create;
el('form').onsubmit=async e=>{e.preventDefault();if(busy||loading)return;if(!token()){el('notice').textContent='Please sign in through the bridge first.';return}const input=el('prompt').value.trim();if(!input&&!pendingImage)return;if(!current())await create();const c=current();if(!c)return;const image=pendingImage;const msg={role:'user',content:input||'Please examine this screenshot.',...(image?{image}:{})};c.messages.push(msg);if(c.messages.length===1)c.title=input.slice(0,48)||'Screenshot question';pendingImage=null;el('file').value='';showAttachment();el('prompt').value='';busy=true;el('send').disabled=true;render();el('notice').textContent='Thinking…';try{await saveChat(c);const response=await api('/coding/chat','POST',{messages:c.messages.slice(-80).map(m=>({role:m.role,content:m.content,...(m.image&&c.messages.indexOf(m)>=c.messages.length-12?{image:m.image.data}:{})}))});c.messages.push({role:'assistant',content:response.reply});await saveChat(c);el('notice').textContent='Saved to your account in Neon.'}catch(ex){el('notice').textContent=ex.message+' — your question remains in this chat; retry later.';el('prompt').value=input;pendingImage=image;showAttachment()}finally{busy=false;el('send').disabled=false;render()}};
el('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el('form').requestSubmit()}};
async function init(){try{if(!token())throw Error('Please sign in through the bridge first.');const data=await api('/coding/chats');chats=(data.chats||[]).map(c=>({...c,messages:typeof c.messages==='string'?JSON.parse(c.messages):c.messages}));let old=[];try{old=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{};if(Array.isArray(old)&&old.length){let imported=0;for(const c of old){if(chats.some(x=>x.id===c.id))continue;try{await saveChat(c);chats.push(c);imported++}catch(e){el('notice').textContent='Some browser chats could not be imported: '+e.message;break}}if(imported===old.length){localStorage.removeItem(KEY);chats.sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')))}}selected=chats[0]?.id||null;if(!chats.length)el('notice').textContent='Start a new chat. Conversations are saved in Neon.';else el('notice').textContent='Conversations are synced to your account.'}catch(e){el('notice').textContent='Could not load chats: '+e.message+' (Run migration 011 and deploy Worker.)'}finally{loading=false;render()}}
init();
</script></body></html>
