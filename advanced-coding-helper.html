<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Coding Helper · Cluff Learning Systems</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#070c18;color:#e6eefb}*{box-sizing:border-box}body{margin:0}header{padding:14px 20px;border-bottom:1px solid #293c55;display:flex;align-items:center;gap:12px;background:#0a1323}a{color:#4fd1e0;text-decoration:none}button{cursor:pointer;background:#182b43;color:#e6eefb;border:1px solid #39536c;border-radius:8px;padding:9px 13px}button:hover{background:#244361}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);height:calc(100dvh - 59px)}aside{border-right:1px solid #293c55;padding:14px;overflow:auto}#threads button{display:block;width:100%;text-align:left;margin:7px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.active{border-color:#4fd1e0}main{display:flex;flex-direction:column;min-width:0}#messages{flex:1;overflow:auto;padding:24px max(18px,calc((100% - 900px)/2));display:flex;flex-direction:column;gap:18px}.message{line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#16263c;padding:14px;border-radius:12px;align-self:flex-end;max-width:90%}.assistant{width:100%}.role{font-size:12px;color:#4fd1e0;font-weight:700;margin-bottom:6px}pre{background:#030811;border:1px solid #34435a;border-radius:9px;padding:15px;overflow:auto;white-space:pre}code{font-family:ui-monospace,monospace;font-size:13px}pre button{float:right;margin:-6px -6px 8px 10px;font-size:12px}.composer{border-top:1px solid #293c55;padding:14px max(18px,calc((100% - 900px)/2));display:flex;gap:10px}textarea{flex:1;resize:vertical;min-height:65px;max-height:200px;background:#0b1728;border:1px solid #39536c;border-radius:9px;padding:12px;color:inherit;font:inherit}#notice{font-size:12px;color:#a9b9ce;padding:0 18px 8px}@media(max-width:650px){.shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}aside{border-right:0;border-bottom:1px solid #293c55;padding:8px;display:flex;gap:8px;align-items:center}#threads{display:flex;overflow:auto;gap:5px}#threads button{width:135px;flex:none;margin:0}#messages{padding:15px}.composer{padding:10px}} .attachment{display:flex;align-items:center;gap:10px;padding:8px 14px}.attachment img{max-height:95px;max-width:150px;border-radius:7px}.attachment button{padding:5px 9px}.message img.screenshot{display:block;max-width:min(100%,700px);max-height:500px;object-fit:contain;margin-top:8px;border-radius:8px}#attach{flex:none} </style></head><body>
<header><a href="index.html">← Bridge</a><strong>⌘ Advanced Coding Helper</strong></header>
<div class="shell"><aside><button id="new">+ New chat</button><div id="threads"></div></aside><main><div id="messages"></div><div class="attachment" id="attachment" hidden></div><form class="composer" id="form"><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><button id="attach" type="button" title="Attach screenshot">📎 Screenshot</button><textarea id="prompt" placeholder="Ask about coding, databases, APIs, debugging, or deploying an application…" required></textarea><button id="send">Send</button></form><div id="notice">Conversations are stored in this browser. Do not paste passwords, API keys, or production credentials.</div></main></div>
<script>
const API='https://cluff-learning-api.kylecluff.workers.dev', KEY='cls_advanced_coding_chats_v1', TOKEN='cls_jwt';
let chats=[],selected=null,busy=false,pendingImage=null;
try{chats=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(chats))chats=[]}catch{}
const el=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(chats))}catch{el('notice').textContent='Browser storage is full. Your latest conversation may not be saved.'}};
const current=()=>chats.find(c=>c.id===selected);
function showAttachment(){const box=el('attachment');box.replaceChildren();box.hidden=!pendingImage;if(!pendingImage)return;const img=document.createElement('img');img.src=pendingImage.data;img.alt='Screenshot preview';const label=document.createElement('span');label.textContent=pendingImage.name;const remove=document.createElement('button');remove.textContent='Remove';remove.onclick=()=>{pendingImage=null;el('file').value='';showAttachment()};box.append(img,label,remove)}
async function attachFile(file){if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)){el('notice').textContent='Choose a PNG, JPEG, WebP, or GIF screenshot.';return}if(file.size>4*1024*1024){el('notice').textContent='Screenshot exceeds 4 MB. Please crop or compress it.';return}const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});pendingImage={name:file.name,data};showAttachment()}
el('attach').onclick=()=>el('file').click();
el('file').onchange=async e=>{try{await attachFile(e.target.files[0])}catch{el('notice').textContent='Could not read screenshot.'}};
el('prompt').addEventListener('paste',async e=>{const item=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(item){e.preventDefault();try{await attachFile(item.getAsFile())}catch{el('notice').textContent='Could not paste screenshot.'}}});
function create(){const c={id:crypto.randomUUID(),title:'New conversation',messages:[]};chats.unshift(c);selected=c.id;save();render()}
function render(){el('threads').replaceChildren();for(const c of chats){const b=document.createElement('button');b.textContent=c.title;b.className=c.id===selected?'active':'';b.onclick=()=>{selected=c.id;render()};el('threads').append(b)}el('messages').replaceChildren();const c=current();if(!c)return; if(!c.messages.length){const intro=document.createElement('div');intro.className='message assistant';intro.textContent='What would you like to build or debug? I can help with code, SQL databases, architecture, APIs, deployment, and troubleshooting.';el('messages').append(intro)}for(const m of c.messages){const wrap=document.createElement('div');wrap.className='message '+m.role;const label=document.createElement('div');label.className='role';label.textContent=m.role==='user'?'You':'Coding Helper';wrap.append(label);if(m.role==='user'){wrap.append(document.createTextNode(m.content));if(m.image?.data){const img=document.createElement('img');img.className='screenshot';img.src=m.image.data;img.alt='Attached screenshot';wrap.append(img)}}else formatAnswer(wrap,m.content);el('messages').append(wrap)}el('messages').scrollTop=el('messages').scrollHeight}
function formatAnswer(parent,s){const re=/```([^\n`]*)\n([\s\S]*?)```/g;let last=0,m;while((m=re.exec(s))){if(m.index>last)parent.append(document.createTextNode(s.slice(last,m.index)));const pre=document.createElement('pre'),btn=document.createElement('button'),code=document.createElement('code');btn.textContent='Copy';const snippet=m[2];btn.onclick=()=>navigator.clipboard.writeText(snippet).then(()=>btn.textContent='Copied');code.textContent=(m[1]?m[1]+'\n':'')+snippet;pre.append(btn,code);parent.append(pre);last=re.lastIndex}if(last<s.length)parent.append(document.createTextNode(s.slice(last)))}
el('new').onclick=create;
el('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const token=localStorage.getItem(TOKEN);if(!token){el('notice').textContent='Please sign in through the Cluff Learning Systems bridge first.';return}const input=el('prompt').value.trim();if(!input&&!pendingImage)return;if(!current())create();const c=current();const image=pendingImage;c.messages.push({role:'user',content:input||'Please examine this screenshot and help me troubleshoot or implement the code.',...(image?{image}:{})});pendingImage=null;el('file').value='';showAttachment();if(c.messages.length===1)c.title=input.slice(0,48);el('prompt').value='';busy=true;el('send').disabled=true;save();render();const id=c.id;el('notice').textContent='Thinking…';try{const response=await fetch(API+'/coding/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({messages:c.messages.slice(-80).map(m=>({role:m.role,content:m.content,...(m.image&&c.messages.indexOf(m)>=c.messages.length-12?{image:m.image.data}:{})}))})});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');const target=chats.find(x=>x.id===id);if(target)target.messages.push({role:'assistant',content:data.reply});save();el('notice').textContent='Conversations are stored in this browser. Do not paste secrets.'}catch(ex){el('notice').textContent=ex.message+' — your question is saved; retry when ready.';const target=chats.find(x=>x.id===id);if(target)target.messages.pop();save();el('prompt').value=input;pendingImage=image;showAttachment()}finally{busy=false;el('send').disabled=false;render()}};
el('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el('form').requestSubmit()}};if(chats.length)selected=chats[0].id;else create();render();
</script></body></html>
