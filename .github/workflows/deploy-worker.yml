# Deploys the cluff-learning-api Cloudflare Worker from worker.js.
#
# Runs on every push to main that changes worker.js or wrangler.toml, and can
# be run by hand from the Actions tab ("Run workflow").
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id the Worker lives in
#
# This workflow sets no Worker secrets or variables. The Worker's own secrets
# (DATABASE_URL, API keys and the rest) stay as they are in Cloudflare, and
# keep_vars = true in wrangler.toml keeps any variables set in the dashboard.

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.toml
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the one in progress.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A worker.js that doesn't parse would take the whole API down for the
      # kids. Stop here instead of deploying it.
      - name: Check worker.js parses
        run: |
          cp worker.js "$RUNNER_TEMP/worker.mjs"
          node --check "$RUNNER_TEMP/worker.mjs"

      - name: Deploy with wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
