name: Apply Essay Coach feedback changes

on:
  push:
    branches:
      - essay-feedback-concise-no-escalation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: essay-feedback-concise-no-escalation
          fetch-depth: 0

      - name: Patch Essay Coach
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          worker_path = Path('worker.js')
          worker = worker_path.read_text()

          old = "overall_feedback:  { type: 'string', description: 'A few paragraphs on flow, organization, voice, consistency, persuasiveness, and any logical fallacies.' },"
          new = "overall_feedback:  { type: 'string', description: 'One short paragraph of exactly four sentences: one specific strength, the single biggest issue to improve, a second specific strength, and a brief encouraging wrap-up.' },"
          assert worker.count(old) == 1, 'overall_feedback schema text changed unexpectedly'
          worker = worker.replace(old, new)

          grading_prompt = r'''function buildGradingSystemPrompt(assignment, feedbackLevel) {
            const band = feedbackBand(feedbackLevel);
            const rubricLines = Object.entries(ESSAY_RUBRIC).map(([, v]) => `- ${v.label}: ${v.max} points`).join('\n');

            return `You are a rigorous, fair college writing instructor grading a first-year college-level essay. Grade honestly and consistently — do not adjust the rubric for the student's age or grade level; grade the writing itself as if it were submitted to a college composition course.

          RUBRIC (100 points total, score each category independently):
          ${rubricLines}

          A 100 means: no spelling or grammar errors, a clear and persuasive message with strong support, eloquent word choice suited to the topic without being pretentious, and writing that would score well in a first-year college writing class.

          Do not grade on raw length. The length guidance below is a soft target — judge whether the essay makes its point clearly without belaboring it and without skimping. Reward rich, specific writing: concrete examples, apt literary devices, references, facts, and rhetorical technique used well. Penalize padding, vagueness, and unsupported claims.

          ASSIGNMENT PROMPT:
          """
          ${assignment.prompt}
          """
          Length guidance given to the student: ${assignment.length_guidance || '(none specified)'}

          FEEDBACK VOICE:
          Write every piece of prose the student will read — sentence notes and suggestions, rubric notes, strengths, overall feedback, and the descriptions in issues_catalog — for ${band.label}. ${band.guidance}

          Treat every issue in this essay on its own merits. Do not chastise the student for having made the same kind of mistake in earlier essays, do not intensify the language because an issue is recurring, and do not mention how many times they have made it before. Skills such as spelling and mechanics take sustained practice over many essays. Simply identify what is wrong now and explain what would improve it.

          The overall_feedback field is the most important student-facing summary. A younger student may read only this paragraph, so make it count. It MUST be one short paragraph of exactly four sentences:
          1. Start with one specific, genuine thing the student did well in THIS essay.
          2. Identify ONLY the single biggest issue holding THIS essay back and state clearly what the student should do differently. Do not cram multiple weaknesses into this sentence.
          3. Give one more specific, genuine thing the student did well.
          4. End with a short encouraging statement that ties the feedback together and leaves the student knowing what to work on next.
          Keep this paragraph compact and punchy. Do not summarize the whole rubric here. The detailed rubric, sentence notes, strengths list, and issue catalog below it are where advanced writers can get the full breakdown.

          This governs only HOW you word things. It must NOT change what you look for or how you score:
          - Score against the fixed college rubric above regardless of this setting. A 74 means the same thing at every level.
          - Still find and report every real issue. If a 9-year-old commits a logical fallacy, still flag it — just describe it as "your reason doesn't quite prove your point" rather than naming it a non sequitur.
          - The issue_type slug stays a stable, consistent identifier (e.g. comma_splice, unsupported_claim) no matter what reading level the description is written for. Never simplify or rename the slug itself.

          Segment the essay into sentences covering the ENTIRE text with nothing omitted or reworded, and call the submit_essay_grade tool with your complete result. Be specific in every note — cite the actual words, not just the category.`;
          }'''

          worker, n = re.subn(
              r"function buildGradingSystemPrompt\(assignment, issueHistory, feedbackLevel\) \{.*?\n\}\n\nfunction buildCoachingCheckPrompt",
              grading_prompt + "\n\nfunction buildCoachingCheckPrompt",
              worker,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'buildGradingSystemPrompt block not found'

          selection_and_score = r'''function selectTopIssues(catalog) {
            const tierRank = t => { const i = ISSUE_TIERS.indexOf(t); return i >= 0 ? i : 0; };
            const severityRank = { major: 0, moderate: 1, minor: 2 };
            const scored = (catalog || []).map((issue, index) => ({
              issue,
              type: String(issue.issue_type || '').trim(),
              tier: tierRank(issue.tier),
              severity: severityRank[issue.severity] ?? 2,
              index,
            })).sort((a, b) => a.tier - b.tier || a.severity - b.severity || a.index - b.index);

            const picked = []; const seen = new Set();
            for (const s of scored) {
              if (!s.type || seen.has(s.type)) continue;
              seen.add(s.type);
              picked.push(s.issue);
              if (picked.length >= 5) break;
            }
            return picked;
          }

          function computeAdaptiveScore(scoreTotal, priorScores) {
            let adaptive;
            if (!priorScores.length) {
              // First essay ever: compress upward so a rough first attempt still
              // feels encouraging, while leaving clear room to grow.
              adaptive = 55 + scoreTotal * 0.45;
            } else {
              const baseline = priorScores.reduce((a, b) => a + b, 0) / priorScores.length;
              const delta = scoreTotal - baseline;
              // Reward improvement generously; soften but don't erase a decline.
              adaptive = 78 + delta * (delta >= 0 ? 2.2 : 1.3);
            }
            return clampInt(adaptive, 35, 100);
          }'''

          worker, n = re.subn(
              r"function selectTopIssues\(catalog, history\) \{.*?\n\}\n\nfunction computeAdaptiveScore\(scoreTotal, priorScores, persistentOffender\) \{.*?\n\}",
              selection_and_score,
              worker,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'issue selection/adaptive score block not found'

          history_query = '''    const historyR = await query(env,
              `SELECT issue_type, tier, times_flagged, times_recurred_after_flagged
                 FROM essay_issue_history WHERE user_id = $1
                ORDER BY times_recurred_after_flagged DESC, times_flagged DESC LIMIT 20`,
              [session.user_id]);

          '''
          assert worker.count(history_query) == 1, 'history query block changed unexpectedly'
          worker = worker.replace(history_query, '')

          old = "system: buildGradingSystemPrompt(assignment, historyR.rows || [], session.feedback_level),"
          new = "system: buildGradingSystemPrompt(assignment, session.feedback_level),"
          assert worker.count(old) == 1, 'grading prompt call changed unexpectedly'
          worker = worker.replace(old, new)

          old = "const topFive = selectTopIssues(catalog, historyR.rows || []);"
          new = "const topFive = selectTopIssues(catalog);"
          assert worker.count(old) == 1, 'top issue call changed unexpectedly'
          worker = worker.replace(old, new)

          offender_block = '''    const persistentOffender = (historyR.rows || []).some(h =>
              h.times_recurred_after_flagged >= 3 && catalog.some(c => c.issue_type === h.issue_type));
            const adaptiveScore = computeAdaptiveScore(scoreTotal, priorScores, persistentOffender);'''
          replacement = '''    const adaptiveScore = computeAdaptiveScore(scoreTotal, priorScores);'''
          assert worker.count(offender_block) == 1, 'persistent offender block changed unexpectedly'
          worker = worker.replace(offender_block, replacement)

          worker_path.write_text(worker)

          html_path = Path('essay-coach.html')
          html = html_path.read_text()
          old = '''      <div id="strengthsBlock"></div>

                <div class="sec-head"><h2>Rubric</h2><div class="rule"></div></div>
                <div class="rubric-grid" id="rubricGrid"></div>

                <div class="sec-head"><h2>Overall Feedback</h2><div class="rule"></div></div>
                <div class="panel narrative" id="overallFeedback"></div>

                <div class="sec-head"><h2>Sentence by Sentence</h2><div class="rule"></div></div>'''
          new = '''      <div class="sec-head"><h2>Most Important Feedback</h2><div class="rule"></div></div>
                <div class="panel narrative" id="overallFeedback"></div>

                <div class="sec-head"><h2>Detailed Breakdown</h2><div class="rule"></div></div>
                <div id="strengthsBlock"></div>

                <div class="sec-head"><h2>Rubric</h2><div class="rule"></div></div>
                <div class="rubric-grid" id="rubricGrid"></div>

                <div class="sec-head"><h2>Sentence by Sentence</h2><div class="rule"></div></div>'''
          assert html.count(old) == 1, 'results layout block changed unexpectedly'
          html = html.replace(old, new)

          old = "  $('overallFeedback').textContent=f.overall_feedback||'';\n  if(f.length_assessment) $('overallFeedback').textContent+='\\n\\n'+f.length_assessment;"
          new = "  $('overallFeedback').textContent=f.overall_feedback||'';"
          assert html.count(old) == 1, 'overall feedback rendering changed unexpectedly'
          html = html.replace(old, new)

          html_path.write_text(html)
          PY

      - name: Validate changes
        run: |
          cp worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs
          git diff --check
          grep -q "Treat every issue in this essay on its own merits" worker.js
          grep -q "Most Important Feedback" essay-coach.html
          ! grep -q "persistentOffender" worker.js

      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/essay-feedback-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- worker.js essay-coach.html
          git add -u -- .github/workflows/essay-feedback-patch.yml
          git commit -m "Make Essay Coach feedback concise and non-escalating"
          git push origin HEAD:essay-feedback-concise-no-escalation
